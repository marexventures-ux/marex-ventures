backend:
  name: git-gateway
  branch: main # Branch to update

media_folder: "src/assets/images" # Media files stored in the repo under src/assets/images
public_folder: "/assets/images" # The src attribute for uploaded media will begin with /assets/images

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "SEO Meta Description", name: "description", widget: "string", hint: "Search snippet preview (150-160 characters recommended)"}
      - {label: "Focus Keyword (Rank Math SEO)", name: "focus_keyword", widget: "string", required: false, hint: "Primary keyword to optimize this post for"}
      - {label: "Secondary Keywords", name: "secondary_keywords", widget: "string", required: false, hint: "Comma-separated secondary keywords"}
      - {label: "Pillar Content", name: "is_pillar", widget: "boolean", default: false, required: false, hint: "Check if this is a comprehensive pillar/cornerstone guide"}
      - {label: "Custom URL Permalink", name: "permalink", widget: "string", required: false, hint: "Optional: Define custom URL path, e.g. /blog/business-growth-stress/ (Leave empty for default date URL)"}
      - {label: "Body", name: "body", widget: "markdown"}
